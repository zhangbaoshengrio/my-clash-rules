  # 把它的后台挂在它自己的产品上会形成循环依赖：IP 一旦到期或失效，
  # 就再也进不去后台处理。故指向自建节点。
  # 注意：同为 IP 购买网站的 webshare.io 走的是直连（见 Direct.yml），
  # 因为它直连可用（~219ms），零依赖比走自建节点更稳。
