  # === OpenAI / ChatGPT ===
  - DOMAIN-KEYWORD,browser-intake
  - DOMAIN-KEYWORD,datadoghq
  - DOMAIN,static.cloudflareinsights.com
  - DOMAIN-SUFFIX,algolia.net
  - DOMAIN-SUFFIX,auth0.com
  - DOMAIN-SUFFIX,featuregates.org
  - DOMAIN-SUFFIX,identrust.com
  - DOMAIN-SUFFIX,intercom.io
  - DOMAIN-SUFFIX,intercomcdn.com
  - DOMAIN-SUFFIX,launchdarkly.com
  - DOMAIN-SUFFIX,oaistatic.com
  - DOMAIN-SUFFIX,oaiusercontent.com
  - DOMAIN-SUFFIX,observeit.net
  - DOMAIN-SUFFIX,segment.io
  - DOMAIN-SUFFIX,sentry.io
  - DOMAIN-SUFFIX,stripe.com
  - DOMAIN-KEYWORD,chatgpt
  - DOMAIN-KEYWORD,openai
  - DOMAIN-SUFFIX,arkoselabs.com
  - IP-CIDR,24.199.123.28/32
  - IP-CIDR,64.23.132.171/32

  # === Anthropic / Claude ===
  # 目标：Claude 的所有域名一律进 AI 策略组（静态住宅 ip）
  - DOMAIN-SUFFIX,anthropic.com          # api / mcp-proxy / a-api / a-cdn / s-cdn / assets-proxy
  - DOMAIN-SUFFIX,claude.ai              # a.claude.ai / a-cdn.claude.ai
  - DOMAIN-SUFFIX,claude.com             # platform.claude.com
  - DOMAIN-SUFFIX,claudeusercontent.com  # Artifacts 沙箱
  - DOMAIN-KEYWORD,anthropic
  - DOMAIN-KEYWORD,claude                # 兜底：将来新增的 Claude 域名自动进 AI

  # 2026-08-16 采集器：Claude 桌面端 Google 登录失败
  # "There was an error logging you in."
  #
  # 19:55:57-19:56:30 进程 Claude Helper 的一次登录分裂成两个出口：
  #   js.hcaptcha.com / api.hcaptcha.com / *.w.hcaptcha.com
  #                                       -> Auto[🇭🇰 Svyun-CN2]
  #   claude.com / www.anthropic.com / s-cdn.anthropic.com
  #                                       -> AI[🇹🇼 静态IP-台湾]
  # hCaptcha 的 token 绑定解题时的 IP：香港解题、台湾提交，token 被判无效。
  #
  # 上面那些 DOMAIN-* 规则按域名收 Claude，但收不到 hCaptcha —— 而
  # hcaptcha.com 又不能整条搬进本文件，否则所有 app 的验证码都会走
  # 静态住宅 IP。改成按进程收：Claude 桌面端做的一切（含验证码、含将来
  # 任何没见过的第三方域名）都进 AI 组，其余 app 完全不受影响。
  #
  # 进程名必须写 macOS 上的真实名字。profile 里原有的
  #   PROCESS-NAME,com.anthropic.claude -> AI
  # 是 Android 包名，在 macOS 上 0 次命中（采集器全量数据核对过）；
  # macOS 报的是 "Claude Helper"。
  #
  # 另外两个 claude 相关进程有意不收：
  #   claude.exe       Claude Code CLI，已由上面的 DOMAIN-SUFFIX 和
  #                    IP-CIDR,160.79.104.0/21 覆盖
  #   claudepot-tauri  第三方工具，还会访问 formulae.brew.sh，
  #                    整进程收会把 Homebrew 也拖进静态 IP
  - PROCESS-NAME,Claude Helper

  # 2026-08-12 安卓日志补充：Claude app 的风控请求漏出 AI 组
  #
  # Clash Meta for Android 日志里，com.anthropic.claude 的 27 条连接中
  # 有 26 条走 AI[🇹🇼 静态IP-台湾]（a-api.anthropic.com / claude.ai /
  # api.segment.io / browser-intake-us5-datadoghq.com），只有一条例外：
  #   api3.siftscience.com  ->  MATCH -> Others[🇭🇰 Svyun-CN2]
  # Sift 是做欺诈/风险评分的第三方服务。风控请求从一个跟会话其余流量
  # 不同的机房 IP 过去，恰好就是它专门在抓的信号，所以必须跟 Claude
  # 本体同出口。
  - DOMAIN-SUFFIX,siftscience.com        # api3.siftscience.com 等

  # 2026-08-08 日志补充：嗅探失败时的裸 IP 兜底
  #
  # FlClash 日志里出现过 4 次
  #   [Sniffer] [160.79.104.10] [tls] may not have any sent data
  # claude.exe 建了 TCP 连接但没立刻发 ClientHello（连接池预热），
  # 嗅探器拿不到 SNI，目标就停在裸 IP 上 —— 上面所有 DOMAIN-* 规则
  # 全部落空，连接掉到 MATCH -> Others[🇭🇰 Svyun-CN2]。
  # 那个出口是 103.27.79.5（AS979 NetLab Global，已被判定为 VPN 机房段），
  # Anthropic 对它直接回 403 Request not allowed，表现为 CLI 反复要你 /login。
  #
  # 下面两条按 IP 兜底，让裸 IP 连接照样进 AI 组。
  # 段来自 ARIN，整段登记给 Anthropic, PBC：
  #   NetRange 160.79.104.0 - 160.79.111.255  →  160.79.104.0/21
  #   NetRange 2607:6BC0::/32
  # 加 no-resolve：只兜裸 IP 这条路径，带域名的连接由上面的规则处理，
  # 不必为此多做一次 DNS 解析。
  - IP-CIDR,160.79.104.0/21,no-resolve
  - IP-CIDR6,2607:6bc0::/32,no-resolve

  # === Perplexity ===
  # 2026-08-12 安卓日志：ai.perplexity.app.android 出口分裂 —— 它的
  # api.revenuecat.com 因为本文件的规则走了 AI[🇹🇼 静态IP-台湾]，
  # 但主站掉到 MATCH -> Others[🇭🇰 Svyun-CN2]：
  #   (ai.perplexity.app.android) --> www.perplexity.ai:443 match Match using Others
  # 同一个 app 两个出口，跟 ChatGPT 当初 revenuecat 撞车是同一类问题。
  - DOMAIN-SUFFIX,perplexity.ai
  - DOMAIN-SUFFIX,eppo.cloud             # nxj0g7.fscdn.eppo.cloud，实验/特性开关，同 statsig

  # === X.AI / Grok & 其他 ===
  - DOMAIN-SUFFIX,ai.com
  - DOMAIN-SUFFIX,grok.com
  - DOMAIN-SUFFIX,featureassets.org
  - DOMAIN-SUFFIX,revenuecat.com
  - DOMAIN-SUFFIX,prodregistryv2.org
  - DOMAIN-SUFFIX,8-lives-cat.io
  - DOMAIN-SUFFIX,livekit.cloud
  - DOMAIN-SUFFIX,statsig.com
  - DOMAIN-SUFFIX,statsigapi.net
  # oaistatsig.com 是 OpenAI 自建的 Statsig 实例，与上面的 statsig.com 是
  # 两个独立可注册域名，那条 suffix 覆盖不到它。此前 api.oaistatsig.com
  # 落入 MATCH -> Others[🇭🇰 Svyun-CN2]，而 ChatGPT 其余流量走 AI[🇹🇼 静态IP-台湾]，
  # 与当初 revenuecat 撞车属于同一类：同一个 app 两个出口。
  - DOMAIN-SUFFIX,oaistatsig.com
