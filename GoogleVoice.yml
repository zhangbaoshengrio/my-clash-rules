payload:
  - DOMAIN,voice.google.com
  # 2026-08-12 移除 DOMAIN-SUFFIX,stun.l.google.com —— 它是一条死规则。
  # profile 第 159 行 `DOMAIN-KEYWORD,stun,REJECT` 按子串匹配，永远先命中，
  # 本规则集（第 222 行）根本轮不到。安卓日志 18:40:39 实测：
  #   stun.l.google.com:19302 match DomainKeyword(stun) using REJECT
  # 那次其实是芒果TV 的 WebRTC 探测（与 stun.hitv.com 同一源端口 48779），
  # 拦截符合预期。但代价是：真要打 Google Voice 电话时同样会被拦。
  # 想让 Voice 通话可用，必须在 profile 第 159 行【之上】加豁免，
  # 在本文件里加任何 stun 规则都是无效的。
  #
  # 下面这条保留 —— 它没有死：DOMAIN-KEYWORD,stun 只吃含 "stun" 的子域名，
  # alt1.gmail-smtp-in.l.google.com 这类照常走到本组。
  - DOMAIN-SUFFIX,l.google.com
  - IP-CIDR,216.239.36.145/32
  - IP-CIDR,74.125.39.102/32

  # ═══════════════════════════════════════════════════════════════
  # 2026-08-08 追加：IP 信誉查询站点（借道本组绕开被标记的香港出口）
  #
  # 【为什么放这个文件，而不是新建 IPCheck.yml】
  # 远程 yml 只能决定"哪些域名匹配"，目标策略组是 profile 里
  # `RULE-SET,GoogleVoice,GoogleVoice` 写死的。新建 yml 必须同时改
  # profile 的 rule-providers 和 rules 两处 —— 那就不是纯远程方案了。
  # 本组 = [🇺🇸 静态IP-纽约, 🇹🇼 静态IP-台湾, Proxy, DIRECT]，默认走纽约，
  # 不经过 🇭🇰 Svyun-CN2 (103.27.79.5，已被 Cloudflare 标记)。
  #
  # 【只收录"输入 IP 去查别人"的站点】
  # 绝不要把 ipleak.net / browserleaks.* / dnscheck.tools / ipinfo.io /
  # ip-api.com / ipwho.is 这类"回显你当前出口"的站点加进来 ——
  # 它们必须留在 MATCH -> Others，否则测到的是纽约节点，
  # 而不是你真正想体检的那个出口。
  # ═══════════════════════════════════════════════════════════════

